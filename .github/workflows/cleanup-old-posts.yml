name: Alte Posts auf X aufräumen (einmalig)

# Nur manuell. Liest die Timeline der gewählten Accounts, löscht Bot-Posts, die
# älter als die Aufbewahrungsfrist sind, und trägt jüngere ins Register
# (state/posted.json → _tweets) ein. Details: cleanup-old-posts.js
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-Run (nur auflisten, nichts löschen)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      langs:
        description: 'Accounts (Sprachen), z.B. "it" zum Testen oder "de,fr,it"'
        required: true
        default: 'it'
        type: string
      retention_days:
        description: 'Aufbewahrung in Tagen nach Post-Datum'
        required: true
        default: '14'
        type: string

permissions:
  contents: write          # State-Commit

concurrency:
  group: x-poster          # gleiche Gruppe wie post.yml → kein paralleler State-Commit
  cancel-in-progress: false

jobs:
  cleanup:
    # Gleiches Pinning wie post.yml (ubuntu-latest = 26.04 seit Nov 2026),
    # damit beide Workflows auf derselben Umgebung laufen.
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # bei vielen Alt-Posts wartet das Script auf Rate-Limit-Resets
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm install
        run: npm install

      - name: Cleanup ausführen
        env:
          DRY_RUN:              ${{ github.event.inputs.dry_run }}
          LANGS:                ${{ github.event.inputs.langs }}
          TWEET_RETENTION_DAYS: ${{ github.event.inputs.retention_days }}
          X_TOKENS_DE:          ${{ secrets.X_TOKENS_DE }}
          X_TOKENS_FR:          ${{ secrets.X_TOKENS_FR }}
          X_TOKENS_IT:          ${{ secrets.X_TOKENS_IT }}
        run: node cleanup-old-posts.js

      - name: State zurück-committen
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "wetteralarm-x-bot"
          git config user.email "bot@wetteralarm.ch"
          git add state/posted.json || true
          git diff --cached --quiet || git commit -m "chore: tweet register after cleanup"
          git push || true
